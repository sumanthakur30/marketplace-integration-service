spring.application.name=marketplace-integration-service
server.port=${SERVER_PORT:8096}

spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_marketplace

management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-},%X{tenantId:-}]

# Master switch. Local/prod default OFF — existing ERP clients never hit this service.
marketplace.entitlement.enabled=${MARKETPLACE_ENTITLEMENT_ENABLED:false}
marketplace.entitlement.base-url=${MARKETPLACE_SUBSCRIPTION_BASE_URL:http://localhost:8182}
marketplace.entitlement.flag=FEATURE_MARKETPLACE
marketplace.entitlement.amazon-flag=FEATURE_MARKETPLACE_AMAZON
marketplace.entitlement.flipkart-flag=FEATURE_MARKETPLACE_FLIPKART
marketplace.entitlement.shopify-flag=FEATURE_MARKETPLACE_SHOPIFY
marketplace.entitlement.website-flag=FEATURE_MARKETPLACE_WEBSITE
marketplace.entitlement.module-code=MARKETPLACE
marketplace.entitlement.fail-open=${MARKETPLACE_ENTITLEMENT_FAIL_OPEN:false}

# Shop effective-config probe (ModuleCode.MARKETPLACE) — only when entitlement.enabled=true
marketplace.shop.base-url=${MARKETPLACE_SHOP_BASE_URL:http://localhost:8080}
marketplace.shop.internal-api-key=${MARKETPLACE_SHOP_INTERNAL_API_KEY:${SECURITY_INTERNAL_API_KEY:}}

# Read/reserve sellable qty from stock-service; never write stock tables from this service.
marketplace.stock.enabled=${MARKETPLACE_STOCK_ENABLED:true}
marketplace.stock.reserve-on-ingest=${MARKETPLACE_STOCK_RESERVE_ON_INGEST:true}
marketplace.stock.base-url=${MARKETPLACE_STOCK_BASE_URL:http://localhost:8082}
marketplace.stock.fail-open=${MARKETPLACE_STOCK_FAIL_OPEN:true}
marketplace.stock.internal-api-key=${MARKETPLACE_STOCK_INTERNAL_API_KEY:${SECURITY_INTERNAL_API_KEY:}}

# One retail order per ingested marketplace order, only when that channel's orderSyncEnabled is true.
marketplace.orders.bridge-enabled=${MARKETPLACE_ORDER_BRIDGE_ENABLED:true}
marketplace.orders.base-url=${MARKETPLACE_ORDER_BASE_URL:http://localhost:8083}

# AES-GCM key for channel credentials. Override with MARKETPLACE_CREDENTIALS_KEY. Never log the value.
marketplace.credentials.key=${MARKETPLACE_CREDENTIALS_KEY:change-me-marketplace-credentials-key}

# Selling Partner API app for Amazon authorization and order pull. Blank values make those calls refuse.
# Seller refresh tokens are stored per channel. Inventory push stays on the dry-run flag below.
marketplace.amazon.application-id=${MARKETPLACE_AMAZON_APPLICATION_ID:}
marketplace.amazon.lwa-client-id=${MARKETPLACE_AMAZON_LWA_CLIENT_ID:}
marketplace.amazon.lwa-client-secret=${MARKETPLACE_AMAZON_LWA_CLIENT_SECRET:}
marketplace.amazon.aws-access-key-id=${MARKETPLACE_AMAZON_AWS_ACCESS_KEY_ID:}
marketplace.amazon.aws-secret-access-key=${MARKETPLACE_AMAZON_AWS_SECRET_ACCESS_KEY:}
marketplace.amazon.region=${MARKETPLACE_AMAZON_REGION:eu-west-1}
marketplace.amazon.endpoint=${MARKETPLACE_AMAZON_ENDPOINT:https://sellingpartnerapi-eu.amazon.com}
marketplace.amazon.token-url=${MARKETPLACE_AMAZON_LWA_TOKEN_URL:https://api.amazon.com/auth/o2/token}
marketplace.amazon.authorize-url=${MARKETPLACE_AMAZON_AUTHORIZE_URL:https://sellercentral.amazon.in/apps/authorize/consent}
marketplace.amazon.marketplace-id=${MARKETPLACE_AMAZON_MARKETPLACE_ID:A21TJRUUN4KGV}
marketplace.amazon.draft-consent=${MARKETPLACE_AMAZON_DRAFT_CONSENT:true}

marketplace.flipkart.base-url=${MARKETPLACE_FLIPKART_BASE_URL:https://api.flipkart.net}

# Channel adapters (stubs until credentials + contracts wired)
marketplace.channels.amazon.enabled=${MARKETPLACE_AMAZON_ENABLED:false}
marketplace.channels.amazon.dry-run=${MARKETPLACE_AMAZON_DRY_RUN:true}
marketplace.channels.amazon.inventory-endpoint=${MARKETPLACE_AMAZON_INVENTORY_ENDPOINT:}
marketplace.channels.flipkart.enabled=${MARKETPLACE_FLIPKART_ENABLED:false}
marketplace.channels.shopify.enabled=${MARKETPLACE_SHOPIFY_ENABLED:false}
marketplace.channels.shopify.dry-run=${MARKETPLACE_SHOPIFY_DRY_RUN:true}
marketplace.channels.shopify.api-version=${MARKETPLACE_SHOPIFY_API_VERSION:2024-10}
marketplace.channels.website.enabled=${MARKETPLACE_WEBSITE_ENABLED:false}

# Inbound webhooks HMAC (off until production keys)
marketplace.inbound.signing-enabled=${MARKETPLACE_INBOUND_SIGNING_ENABLED:false}
marketplace.inbound.hmac-secret=${MARKETPLACE_INBOUND_HMAC_SECRET:}
marketplace.inbound.shopify-hmac-secret=${MARKETPLACE_SHOPIFY_HMAC_SECRET:}
marketplace.inbound.amazon-hmac-secret=${MARKETPLACE_AMAZON_HMAC_SECRET:}
marketplace.inbound.auto-process=${MARKETPLACE_WEBHOOK_AUTO_PROCESS:true}
