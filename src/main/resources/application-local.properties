spring.datasource.url=${MARKETPLACE_DB_URL:jdbc:postgresql://localhost:5432/marketplacedb}
spring.datasource.username=${MARKETPLACE_DB_USERNAME:marketplacedb}
spring.datasource.password=${MARKETPLACE_DB_PASSWORD:marketplacedb}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

marketplace.entitlement.enabled=false

# Local without Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:false}
