# Opt-in snippet for docker-compose.ec2-rds.yml
#
# Gateway env (under gateway-service environment):
#   GATEWAY_MARKETPLACE_URI: ${GATEWAY_MARKETPLACE_URI:-http://marketplace-integration-service:8096}
#
# Service (profile marketplace only):

  marketplace-integration-service:
    <<: *jvm-service
    profiles: ["marketplace"]
    image: ${IMAGE_PREFIX:-sumanthakur30}/marketplace-integration-service:${MARKETPLACE_IMAGE_TAG:-${IMAGE_TAG:-1.0.0}}
    mem_limit: ${MARKETPLACE_SERVICE_MEM_LIMIT:-400m}
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: marketplace-integration-service
      SERVER_PORT: 8096
      MARKETPLACE_DB_URL: ${MARKETPLACE_DB_URL}
      MARKETPLACE_DB_USERNAME: ${MARKETPLACE_DB_USERNAME:-marketplacedb}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:-marketplacedb}
      SPRING_DATASOURCE_URL: ${MARKETPLACE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${MARKETPLACE_DB_USERNAME:-marketplacedb}
      SPRING_DATASOURCE_PASSWORD: ${MARKETPLACE_DB_PASSWORD:-marketplacedb}
      MARKETPLACE_ENTITLEMENT_ENABLED: ${MARKETPLACE_ENTITLEMENT_ENABLED:-false}
      MARKETPLACE_STOCK_BASE_URL: ${MARKETPLACE_STOCK_BASE_URL:-http://stock-service:8082}
      MARKETPLACE_ORDER_BASE_URL: ${MARKETPLACE_ORDER_BASE_URL:-http://order-service:8083}
      MARKETPLACE_SHOP_BASE_URL: ${MARKETPLACE_SHOP_BASE_URL:-http://shop-service:8080}
      SERVER_ERROR_INCLUDE_MESSAGE: always
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      # India Selling Partner. Leave secrets empty until live keys are added to .env.production.
      MARKETPLACE_AMAZON_APPLICATION_ID: ${MARKETPLACE_AMAZON_APPLICATION_ID:-}
      MARKETPLACE_AMAZON_LWA_CLIENT_ID: ${MARKETPLACE_AMAZON_LWA_CLIENT_ID:-}
      MARKETPLACE_AMAZON_LWA_CLIENT_SECRET: ${MARKETPLACE_AMAZON_LWA_CLIENT_SECRET:-}
      MARKETPLACE_AMAZON_AWS_ACCESS_KEY_ID: ${MARKETPLACE_AMAZON_AWS_ACCESS_KEY_ID:-}
      MARKETPLACE_AMAZON_AWS_SECRET_ACCESS_KEY: ${MARKETPLACE_AMAZON_AWS_SECRET_ACCESS_KEY:-}
      MARKETPLACE_AMAZON_REGION: ${MARKETPLACE_AMAZON_REGION:-eu-west-1}
      MARKETPLACE_AMAZON_ENDPOINT: ${MARKETPLACE_AMAZON_ENDPOINT:-https://sellingpartnerapi-eu.amazon.com}
      MARKETPLACE_AMAZON_MARKETPLACE_ID: ${MARKETPLACE_AMAZON_MARKETPLACE_ID:-A21TJRUUN4KGV}
      MARKETPLACE_AMAZON_DRAFT_CONSENT: ${MARKETPLACE_AMAZON_DRAFT_CONSENT:-true}
      MARKETPLACE_AMAZON_AUTHORIZE_URL: ${MARKETPLACE_AMAZON_AUTHORIZE_URL:-https://sellercentral.amazon.in/apps/authorize/consent}
    depends_on:
      discovery-service:
        condition: service_healthy
